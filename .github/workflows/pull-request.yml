name: Pull Request SDLC Gate

on:
  pull_request:
    branches:
      - main

jobs:
  sdlc-gate:
    name: SDLC Verification & Security Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: central_crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d central_crm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      JWT_SECRET: dialpulse-central-crm-test-jwt-secret-key-32chars-min
      REFRESH_TOKEN_SECRET: dialpulse-central-crm-test-refresh-secret-32chars-min

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 3. Install Dependencies (locked)
        run: npm ci

      - name: 4. SDLC PR & Lifecycle Gate
        run: |
          npm run verify:sdlc
          npm run verify:pr

      - name: 5. Typecheck & Code Hygiene
        run: npm run lint

      - name: 6. Automated Platform Test Suite
        run: npm test

      - name: 7. Automated Security Regression Suite
        run: npm run test:security

      - name: 8. Database Schema & Integrity Gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/central_crm_ci
        run: npm run verify:db

      - name: 8a. Live PostgreSQL Migration and Adoption Integration
        env:
          MIGRATION_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MIGRATION_TEST_ALLOW_DB_CREATE: 'true'
          NODE_ENV: test
        run: npm run test:migrations:integration

      - name: 9. Production Build Compilation
        run: npm run build
