    <script>
      // Gracefully handle dev server WebSocket disconnections
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('WebSocket') || e.reason.message.includes('vite'))) {
          e.preventDefault();
        }
      });
    </script>
